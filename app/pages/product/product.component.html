<div class="container my-4">
  <!-- All Product Cards -->
  <div *ngIf="!selectedProduct" class="row g-4">
    <div
  class="col-12 col-sm-6"
  *ngFor="let product of products"
  [ngStyle]="product.id === 'blog' ? {'width': '100%'} : {}"
>
  <div
    [ngClass]="product.cardClass"
    (click)="navigateTo(product.id)"
    [style.backgroundImage]="'url(' + product.image + ')'"
  >
    <div class="blog-content">
      <h2>{{ product.title }}</h2>
      <p>{{ product.description }}</p>
    </div>
    <span class="blog-icon">{{ product.icon }}</span>
    <div class="footer-note">{{ product.footer }}</div>
  </div>
</div>

  </div>

  <!-- Single Product View -->
<div *ngIf="selectedProduct" class="container py-5">
  <div
    class="d-flex flex-column align-items-center justify-content-center text-center p-4"
  >
    <div
      class="{{ selectedProduct.cardClass }} w-100"
      [style.background-image]="'url(' + selectedProduct.image + ')'"
      style="padding: 2rem; background-size: cover; background-position: center; border-radius: 1rem;"
    >
      <div class="blog-content">
        <h2 class="fw-bold mb-3">{{ selectedProduct.title }}</h2>
        <p class="mb-4">{{ selectedProduct.description }}</p>
      </div>

      <span class="blog-icon d-block mb-2">{{ selectedProduct.icon }}</span>
      <div class="footer-note mb-4">{{ selectedProduct.footer }}</div>

      <div class="d-flex flex-column flex-sm-row justify-content-center align-items-center gap-3">
        <button
          class="btn btn-lg px-4"
          style="background: linear-gradient(90deg, #ff6b6b, #4ecdc4); color: black; border: none;"
          (click)="exploreProduct(selectedProduct.exploreUrl)"
        >
          Explore Product
        </button>

        <button
          class="btn btn-lg px-4"
          style="background: #4ecdc4; color: black; border: none;"
          (click)="backToAll()"
        >
         Back to Products
        </button>
      </div>
    </div>
  </div>
</div>
